# Supabase CLI configuration for local development (`supabase start`).
# Only the settings ProductFlow AI relies on are listed; the CLI fills in defaults for the rest.
project_id = "productflow-ai"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Local development only: sign in immediately without confirming the email address.
enable_confirmations = false
